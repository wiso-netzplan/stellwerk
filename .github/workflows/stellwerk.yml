# Stellwerk-Automat: schreibt aktuell.json, wenn die Eingabeseite einen Auftrag schickt.
# Im Verlauf steht damit github-actions, nicht das Konto der Lehrkraft.
#   stellwerk  – Speichern aus der Eingabeseite (Termine, Prüfungen, Ferien, eigene Nachrichten …).
#                Die automatischen Nachrichten und die Automatik-Einstellungen bleiben dabei erhalten.
#   automatik  – Notbremse: Automatik aus/an, eine Meldung entfernen oder wieder zulassen. Wirkt sofort.
name: Stellwerk
on:
  repository_dispatch:
    types: [stellwerk, automatik]
permissions:
  contents: write
concurrency:
  # Zwei Speichern hintereinander: das neuere gewinnt. Notbremse-Aufträge laufen alle einzeln.
  group: ${{ github.event.action == 'stellwerk' && 'stellwerk' || format('automatik-{0}', github.run_id) }}
jobs:
  schreiben:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auftrag übernehmen
        env:
          AUFTRAG: ${{ github.event.action == 'stellwerk' && toJSON(github.event.client_payload.aktuell) || toJSON(github.event.client_payload) }}
          ART: ${{ github.event.action }}
        run: |
          printf '%s' "$AUFTRAG" > "$RUNNER_TEMP/auftrag.json"
          if [ "$ART" = stellwerk ]; then
            werkzeug/schreiben.sh "Stellwerk: Stand $(jq -r .stand "$RUNNER_TEMP/auftrag.json")" stellwerk "$RUNNER_TEMP/auftrag.json"
          else
            werkzeug/schreiben.sh "Stellwerk: Automatik $(jq -r .aktion "$RUNNER_TEMP/auftrag.json")" aktion "$RUNNER_TEMP/auftrag.json"
          fi
