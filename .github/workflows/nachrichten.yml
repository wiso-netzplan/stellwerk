# Nachrichten-Automat: holt um 6, 9, 12, 15 und 18 Uhr (deutsche Zeit, Eike 12.11.2026) die Spitze der
# tagesschau-Startseite, ersatzweise die Deutschlandfunk-Nachrichten, dazu den neuesten Beitrag „Hintergrund aktuell“
# der bpb. Ohne Freigabe, ohne KI, ohne Filter nach Themen (Eike, 10.11.2026). Notbremse im Stellwerk.
name: Nachrichten
on:
  schedule:
    # GitHub startet geplante Läufe nur nach Kräften (11.11.2026: ab 12:47 Uhr gar keiner mehr). Darum mehrere
    # Versuche in den zwei Stunden ab jedem Termin (UTC; Sommer- und Winterzeit). Das Skript entscheidet selbst:
    # Der erste Lauf nach einem Termin holt, die übrigen tun nichts. Verlassen kann man sich darauf nicht;
    # dafür ist der Wecker gedacht (README, Abschnitt „Wecker“).
    - cron: '7,22,37,52 4,5,7,8,10,11,13,14,16,17 * * *'
  workflow_dispatch:
    inputs:
      wecker:
        description: 'Aufruf durch den Wecker: holt nur, wenn ein Termin (6, 9, 12, 15, 18 Uhr) fällig ist. Von Hand aus lassen, dann holt er sofort.'
        type: boolean
        default: false
  repository_dispatch:
    types: [nachrichten]   # Knopf „Jetzt holen“ im Stellwerk
permissions:
  contents: write
concurrency:
  group: nachrichten
jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Nachrichten holen und schreiben
        run: |
          werkzeug/schreiben.sh "Nachrichten: $(TZ=Europe/Berlin date '+%d.%m. %H:%M')" holen ${{ (github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && !inputs.wecker)) && '--immer' || '' }}
